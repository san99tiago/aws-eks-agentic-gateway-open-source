apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.namePrefix }}-aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.awsRegion }}
      # No "auth" block: ESO uses the default AWS credential chain, which on this
      # cluster resolves to EKS Pod Identity (role attached to the ESO ServiceAccount).
