{{- range $k8sName, $smName := .Values.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $k8sName }}
  namespace: {{ $.Values.targetNamespace }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.namePrefix }}-aws-secrets-manager
  target:
    name: {{ $k8sName }}
    creationPolicy: Owner
  data:
    # agentgateway reads the provider API key from the "Authorization" key by default
    - secretKey: Authorization
      remoteRef:
        key: {{ $smName }}
{{- end }}
