apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
  annotations:
    # agentgateway reads the MCP endpoint path from this annotation (default /mcp)
    agentgateway.dev/mcp-path: {{ .Values.mcpPath }}
spec:
  selector:
    app: {{ .Values.name }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
      # Tells agentgateway this Service speaks MCP
      appProtocol: agentgateway.dev/mcp
