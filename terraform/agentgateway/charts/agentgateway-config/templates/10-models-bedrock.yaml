# LLM-GW: Amazon Bedrock models. Guardrail applied NATIVELY by Bedrock (guardrailConfig on the invoke).
# Auth: implicit AWS credential chain -> EKS Pod Identity role attached to the proxy ServiceAccount.
# dropParams: request fields the upstream model rejects (OpenAI GPT-6 on Bedrock: temperature, top_p)
# are set to null on the OpenAI body, so the OpenAI -> Converse translation leaves them out.
# openaiReasoningEffort: OpenAI-on-Bedrock reasoning effort, injected AFTER the translation as Converse
# additionalModelRequestFields.reasoning.effort. agentgateway v1.5.0 cannot parse the encrypted
# reasoningContent.redactedContent blocks GPT-6 returns when it reasons (fixed upstream in v1.6.0 for
# non-streaming and v1.7.0 for streaming), so the demo pins "none".
{{- range .Values.bedrockModels }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.gateway.namespace }}
  labels:
    {{- include "agw.labels" $ | nindent 4 }}
    agentgateway-santi-open/provider: bedrock
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.gateway.name }}
      sectionName: http
  match:
    model: {{ .name }}
  visibility: Public
  provider: Bedrock
  bedrock:
    region: {{ $.Values.awsRegion }}
    guardrail:
      identifier: {{ $.Values.guardrail.identifier | quote }}
      version: {{ $.Values.guardrail.version | quote }}
  policies:
    transformations:
      - field: model
        expression: {{ printf "%q" .modelId | quote }}
      {{- range .dropParams }}
      - field: {{ . }}
        expression: "null"
      {{- end }}
    {{- if .openaiReasoningEffort }}
    finalTransformations:
      - field: additionalModelRequestFields
        expression: {{ printf "{\"reasoning\": {\"effort\": %q}}" .openaiReasoningEffort | quote }}
    {{- end }}
    health:
      unhealthyCondition: "response.code >= 500"
      eviction:
        consecutiveFailures: 2
        duration: 60s
{{- end }}
